databases:
  - name: yardwatch-db
    plan: free

services:
  - type: web
    name: yardwatch-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_web:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yardwatch-db
          property: connectionString

  - type: cron
    name: yardwatch-scrape
    runtime: python
    plan: starter
    # Render's cron schedule runs in UTC. These times (8am, 8pm, 2am UTC)
    # land on 2am, 2pm, 8pm Mountain Time (UTC-6, MDT). If this drifts an
    # hour when daylight saving changes (Nov/March), shift each by 1 hour.
    schedule: "0 2,8,20 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yardwatch-db
          property: connectionString

  - type: cron
    name: yardwatch-scrape-summary
    runtime: python
    plan: starter
    # 2pm UTC = 8am Mountain Time (UTC-6, MDT). See note above about DST.
    schedule: "0 14 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --summary
    envVars:
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yardwatch-db
          property: connectionString
