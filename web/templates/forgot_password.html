{% extends "auth_dark.html" %}
{% block title %}YardWatch | Forgot Password{% endblock %}
{% block content %}
<h1 class="disp authtitle">Forgot password</h1>
<p class="authlede">Enter your account email and we'll send you a link to reset it.</p>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<form method="post" class="authform">
    <label><span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
    </label>
    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark"></div>
    <button type="submit" class="btn btn-hot authsubmit">Send reset link</button>
</form>
<p class="authalt"><a href="{{ url_for('routes.login') }}">Back to log in</a></p>
{% endblock %}
