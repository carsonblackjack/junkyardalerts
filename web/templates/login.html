{% extends "base.html" %}
{% block content %}
<h2>Log In</h2>
<form method="post">
    <label>Email
        <input type="email" name="email" required>
    </label>
    <label>Password
        <input type="password" name="password" required>
    </label>
    <button type="submit">Log In</button>
</form>
<p>Don't have an account? <a href="{{ url_for('routes.register') }}">Sign up</a></p>
{% endblock %}
