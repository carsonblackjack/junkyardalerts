{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-lede">Your watchlist's been checking the yards while you were away.</p>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <form method="post" class="stack">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>
        <button type="submit">Log In</button>
    </form>
    <p><a href="{{ url_for('routes.forgot_password') }}">Forgot your password?</a></p>
    <p>Don't have an account? <a href="{{ url_for('routes.register') }}">Sign up</a></p>
</div>
{% endblock %}
