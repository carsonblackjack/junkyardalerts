{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2>Sign Up</h2>
    <p class="auth-lede">YardWatch is in beta - you'll need an invite code to join.</p>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <form method="post" class="stack">
        <label>Invite Code
            <input type="text" name="invite_code" required>
        </label>
        <label>First Name (optional)
            <input type="text" name="first_name" placeholder="What should we call you?">
        </label>
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <label class="checkbox-row">
            <input type="checkbox" name="agree_to_terms" required>
            I agree to the <a href="{{ url_for('routes.terms') }}" target="_blank">Terms of Service</a> and <a href="{{ url_for('routes.privacy') }}" target="_blank">Privacy Policy</a>
        </label>
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('routes.login') }}">Log in</a></p>
</div>
{% endblock %}
