{% extends "base.html" %}
{% block content %}
<h2>Sign Up</h2>
<form method="post">
    <label>Email
        <input type="email" name="email" required>
    </label>
    <label>Password
        <input type="password" name="password" required>
    </label>
    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{{ url_for('routes.login') }}">Log in</a></p>
{% endblock %}
