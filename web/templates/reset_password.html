{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2>Reset Password</h2>
    {% if valid %}
        <form method="post" class="stack">
            <label>New Password
                <input type="password" name="password" required>
            </label>
            <label>Confirm New Password
                <input type="password" name="confirm_password" required>
            </label>
            <button type="submit">Set New Password</button>
        </form>
    {% else %}
        <p>That reset link is invalid or has expired. Reset links only work once and expire after an hour.</p>
        <p><a href="{{ url_for('routes.forgot_password') }}">Request a new one</a></p>
    {% endif %}
</div>
{% endblock %}
