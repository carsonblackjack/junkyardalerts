{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>

<h3>Profile</h3>
<form method="post" class="stack">
    <label>First Name
        <input type="text" name="first_name" value="{{ first_name }}" placeholder="What should we call you?">
    </label>

    <h4>Email Alerts</h4>
    <label class="checkbox-row">
        <input type="checkbox" name="notify_daily_summary" {% if notify_daily_summary %}checked{% endif %}>
        Daily summary (totals per yard, once a day)
    </label>
    <label class="checkbox-row">
        <input type="checkbox" name="notify_recently_found" {% if notify_recently_found %}checked{% endif %}>
        Recently found (every new car, any make/model)
    </label>
    <label class="checkbox-row">
        <input type="checkbox" name="notify_watchlist_matches" {% if notify_watchlist_matches %}checked{% endif %}>
        My watchlist matches (only new cars matching my own watchlist)
    </label>

    <button type="submit">Save</button>
</form>
{% endblock %}
